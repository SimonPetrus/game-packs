name: guncelle

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Depo değişkeni (Settings > Variables): kaynak paket sunucusunun taban adresi. Gizli anahtar gerekmez.
      KAYNAK_ADRES: ${{ vars.KAYNAK_ADRES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kaynak önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: kaynak
          key: kaynak-${{ github.run_id }}
          restore-keys: kaynak-

      - name: Önceki yayını al
        run: |
          mkdir yayin
          if git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD | tar -x -C yayin
          fi

      - name: Güncelle
        id: guncelle
        run: |
          test -n "$KAYNAK_ADRES" || { echo "KAYNAK_ADRES değişkeni tanımlı değil"; exit 1; }
          python3 -I tools/paket_birlestir.py --indir "$KAYNAK_ADRES" \
            --kaynak kaynak --cikti yayin --atif-ek atif-ek.md

      - name: Yayınla (gh-pages dalı)
        if: steps.guncelle.outputs.degisti == 'true'
        run: |
          touch yayin/.nojekyll
          cd yayin
          git init -q -b gh-pages
          git config user.name "game-packs-updater"
          git config user.email "game-packs-updater@users.noreply.github.com"
          git add -A
          git commit -q -m "paketler güncellendi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
